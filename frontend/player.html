<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OwK 播放器</title>
<script src="/js/ws_client.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:sans-serif}

video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:contain}

.status-badge{position:fixed;top:calc(4% + 110px);right:4%;z-index:3;
  padding:6px 14px;border-radius:16px;font-size:13px;background:rgba(0,0,0,.5);color:#7c5cfc}
#qrWrap{position:fixed;top:4%;right:4%;z-index:4;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  opacity:.45;transition:opacity .3s}
#qrWrap:hover{opacity:1}
#qrWrap img{border-radius:6px;background:#fff;width:90px;height:90px}
#qrWrap .ql{font-size:9px;color:rgba(255,255,255,.35);white-space:nowrap}
.hidden{display:none!important}
#songTitle{position:fixed;top:3%;left:3%;z-index:3;
  padding:8px 18px;border-radius:10px;font-size:clamp(14px,2vw,22px);
  background:rgba(0,0,0,.55);color:#fff;max-width:60%;line-height:1.3}

#idleScreen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0a0a0f;color:rgba(255,255,255,.3);font-size:clamp(18px,3vw,36px)}
#idleScreen .logo{font-size:clamp(48px,8vw,96px);color:#7c5cfc;margin-bottom:16px}
#idleScreen .sub{font-size:clamp(12px,1.5vw,18px);margin-top:8px;color:rgba(255,255,255,.15)}
#idleScreen .idle-qr{margin-top:30px;opacity:.92}
#idleScreen .idle-qr img{width:clamp(110px,16vw,170px);height:auto;border-radius:10px;
  background:#fff;padding:8px;box-shadow:0 0 24px rgba(124,92,252,.35)}
#idleScreen .idle-qr .ql{font-size:clamp(11px,1.4vw,15px);color:rgba(255,255,255,.4);margin-top:8px}
#idleScreen.hidden{display:none}
#loginOverlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:11;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0a0a0f;color:#fff}
#loginOverlay .login-title{font-size:clamp(18px,3vw,30px);color:#7c5cfc;margin-bottom:6px}
#loginOverlay .login-sub{font-size:clamp(12px,1.6vw,16px);color:rgba(255,255,255,.4);margin-bottom:22px}
#loginOverlay img{width:clamp(150px,24vw,240px);background:#fff;padding:10px;border-radius:12px}
#loginOverlay .login-status{margin-top:16px;font-size:clamp(13px,1.8vw,18px);color:#8f8}
#loginOverlay .login-status.expired{color:#f88}
#loginOverlay button{margin-top:14px;background:#2a2a3a;color:#fff;border:none;
  padding:8px 22px;border-radius:8px;font-size:14px;cursor:pointer}
#loginOverlay button:hover{background:#7c5cfc}
#coverLayer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;
  display:flex;align-items:center;justify-content:center;background:#0a0a0f}
#coverLayer img{width:min(60vw,60vh);border-radius:12px;box-shadow:0 0 40px rgba(0,0,0,.6)}
#coverLayer .cover-badge{position:absolute;bottom:14%;font-size:13px;color:rgba(255,255,255,.4);
  background:rgba(0,0,0,.5);padding:4px 12px;border-radius:10px}
#unmuteHint{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:8;
  background:rgba(124,92,252,.92);color:#fff;padding:10px 22px;border-radius:10px;
  font-size:15px;display:none;white-space:nowrap;animation:hintblink 1.2s infinite}
@keyframes hintblink{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>

<div id="idleScreen">
  <div class="logo">♫</div>
  <div id="idleMsg">等待连接...</div>
  <div class="sub">请用手机打开控制器页面点歌</div>
  <div class="idle-qr"><img src="/api/qr/controller" alt="扫码点歌"><div class="ql">手机扫码点歌</div></div>
</div>

<video id="playerVideo" playsinline></video>
<div id="coverLayer" class="hidden"><img id="coverImg" alt=""><div class="cover-badge">音频模式</div></div>
<div id="unmuteHint">按 回车 / OK / 空格 开启声音</div>

<div id="qrWrap"><img id="qrImg" src="/api/qr/controller" alt="QR"><div class="ql">扫码控制</div></div>
<div id="loginOverlay" class="hidden">
  <div class="login-title">请扫码登录B站</div>
  <div class="login-sub">登录后即可搜索与下载歌曲</div>
  <img id="loginQrImg" alt="登录二维码">
  <div id="loginStatus" class="login-status">等待扫码...</div>
  <button onclick="refreshLoginQr()">刷新二维码</button>
</div>
<div class="status-badge" id="statusBadge">未连接</div>
<div id="songTitle" class="hidden"></div>

<script>
const video = document.getElementById('playerVideo');
const ws = new WsClient('/ws/player', onMessage);

// 屏蔽视频组件自身的键盘行为(回车/空格暂停等原生响应), 只保留页面层自定义按键
video.tabIndex = -1;                       // 视频不可通过键盘聚焦
video.addEventListener('keydown', (e) => { e.preventDefault(); });  // 元素级拦截所有按键

let currentSong = null;
let lastSentPos = 0;
let songEndSent = false;
let retryCount = 0;
let retryTimer = null;
let muteFallback = false;
let playRetries = 0;
let loadGen = 0;            // 换源代际: 旧代异步回调(重试/静音回退)不得影响新歌
let playRetryTimer = null;
const MAX_RETRIES = 10;
const MAX_PLAY_RETRIES = 3;

ws.onConnect = () => {
  document.getElementById('idleScreen').classList.add('hidden');
  document.getElementById('statusBadge').textContent = '已连接';
  checkLogin();
};

// ── B站登录(未登录时显示二维码, 扫码成功后保存cookie并自动恢复) ──
let loginPollTimer = null;
let loginActive = false;    // 防并发 checkLogin 重复生成二维码(key 覆盖导致"一直等待扫码")

async function checkLogin() {
  try {
    const r = await fetch('/api/login/status');
    const d = await r.json();
    if (d.logged_in) { if (loginActive) hideLoginOverlay(); }
    else if (!loginActive) showLoginOverlay();
  } catch(e) {}
}

function showLoginOverlay() {
  loginActive = true;
  document.getElementById('loginOverlay').classList.remove('hidden');
  refreshLoginQr();
}

function hideLoginOverlay() {
  loginActive = false;
  document.getElementById('loginOverlay').classList.add('hidden');
  stopLoginPoll();
}

function refreshLoginQr() {
  stopLoginPoll();
  document.getElementById('loginQrImg').src = '/api/login/qr?t=' + Date.now();
  const st = document.getElementById('loginStatus');
  st.textContent = '等待扫码...';
  st.className = 'login-status';
  loginPollTimer = setInterval(pollLogin, 2000);
}

function stopLoginPoll() {
  if (loginPollTimer) { clearInterval(loginPollTimer); loginPollTimer = null; }
}

let loginAutoRefreshAt = 0;

async function pollLogin() {
  try {
    const r = await fetch('/api/login/poll');
    const d = await r.json();
    const st = document.getElementById('loginStatus');
    st.textContent = d.message || d.status;
    if (d.status === 'expired' || d.status === 'error') {
      st.className = 'login-status expired';
      // 自动刷新新二维码(冷却5秒, 防止循环刷爆)
      const now = Date.now();
      if (now > loginAutoRefreshAt) {
        loginAutoRefreshAt = now + 5000;
        setTimeout(refreshLoginQr, 1200);
      }
    } else if (d.status === 'success') {
      st.textContent = '登录成功! 即将继续...';
      st.className = 'login-status';
      stopLoginPoll();
      setTimeout(() => location.reload(), 3000);   // 显示3秒后自动刷新, 恢复正常服务
    }
  } catch(e) {}
}

checkLogin();   // 页面加载即检查登录状态

function loadVideo(song) {
  loadGen++;                                  // 新歌 = 新一代, 旧代回调全部失效
  const gen = loadGen;
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (playRetryTimer) { clearTimeout(playRetryTimer); playRetryTimer = null; }
  document.getElementById('idleScreen').classList.add('hidden');   // 有新歌即收起空闲屏
  video.blur();   // 主动失焦: 焦点若在视频上, 回车会触发组件原生暂停
  video.pause();
  video.removeAttribute('src');
  video.load();
  currentSong = song;
  lastSentPos = 0;
  document.getElementById('songTitle').textContent = song.title || '';
  document.getElementById('songTitle').classList.remove('hidden');
  muteFallback = false;
  playRetries = 0;
  video.muted = false;   // 第一步: 先尝试直接有声播放
  syncUnmuteHint();
  video.src = `/api/media/${song.id}`;
  video.load();
  try { video.currentTime = 0; } catch(e) {}
  attemptPlay(gen);
  songEndSent = false;
  retryCount = 0;
  // 纯音频(无视频轨)时显示封面兜底, 避免黑屏只有声音
  const cover = document.getElementById('coverLayer');
  if (song.download_status === 'audio_only' && song.cover) {
    document.getElementById('coverImg').src = song.cover;
    cover.classList.remove('hidden');
  } else {
    cover.classList.add('hidden');
  }
}

// 静音方案: 先多次尝试有声自动播放; 全部失败则静音开播并提示按键开启
function attemptPlay(gen) {
  const p = video.play();
  if (!p || !p.catch) return;
  p.then(() => {
    if (gen !== loadGen) return;
    playRetries = 0;
  }).catch(() => {
    if (gen !== loadGen) return;                          // 旧代链失效, 不得影响新歌
    if (!video.paused && video.currentTime > 0.3) return; // 已在播放: 绝不静音
    playRetries++;
    if (playRetries < MAX_PLAY_RETRIES) {
      playRetryTimer = setTimeout(() => { playRetryTimer = null; attemptPlay(gen); }, 300);
    } else {
      startMutedFallback(gen);
    }
  });
}

function startMutedFallback(gen) {
  if (gen !== loadGen) return;
  muteFallback = true;
  video.muted = true;
  const p = video.play();
  if (p && p.catch) p.catch(() => {});
  syncUnmuteHint();
}

// 用户手势开启声音(回车/OK/空格; 遥控器方向键可能不触发页面事件)
function unmuteByUser() {
  if (!video.muted) { syncUnmuteHint(); return; }
  muteFallback = false;
  video.muted = false;
  syncUnmuteHint();
  if (video.paused) video.play().catch(() => {});
}

// 实时监测静音状态: 无论何种原因(浏览器策略/静音回退)被静音, 都提示按键开启
function syncUnmuteHint() {
  const hint = document.getElementById('unmuteHint');
  hint.style.display = (video.muted && currentSong) ? 'block' : 'none';
}
video.addEventListener('volumechange', syncUnmuteHint);   // muted 变化立即同步
setInterval(syncUnmuteHint, 500);                         // 兜底轮询(浏览器强制静音等)

// 空闲屏: 动态文案(连接中 / 请点歌播放)
function showIdle(msg) {
  document.getElementById('idleMsg').textContent = msg;
  document.getElementById('idleScreen').classList.remove('hidden');
}

document.addEventListener('keydown', (e) => {
  const isEnter = e.key === 'Enter' || e.code === 'Enter' || e.key === 'OK' || e.key === 'NumpadEnter';
  if (isEnter || e.code === 'Space') {
    e.preventDefault();
    if (video.muted) unmuteByUser();   // 只要处于静音, 回车/OK/空格即开启
  }
});

function onMessage(msg) {
  switch (msg.type) {
    case 'play':
      if (msg.song) loadVideo(msg.song);
      else showIdle('请点歌播放');
      break;
    case 'login_refresh':
      if (loginActive) refreshLoginQr();   // 控制端刷新二维码时, 播放端同步更新
      break;
    case 'pause':
      video.pause();
      break;
    case 'resume':
      video.play().catch(() => {});
      break;
    case 'seek':
      if (msg.position !== undefined) video.currentTime = msg.position;
      break;
    case 'state':
      if (msg.state?.current) {
        if (!currentSong || currentSong.id !== msg.state.current.id) {
          loadVideo(msg.state.current);
        } else {
          if (msg.state.status === 'paused') video.pause();
          else if (msg.state.status === 'playing' && video.paused) video.play().catch(() => {});
        }
      } else {
        currentSong = null;
        document.getElementById('songTitle').classList.add('hidden');
        document.getElementById('coverLayer').classList.add('hidden');
        showIdle('请点歌播放');
        video.muted = false;   // 清空时复位静音, 避免空闲屏误提示
        syncUnmuteHint();
        video.pause();
        video.removeAttribute('src');
        video.load();
      }
      break;
  }
}

video.ontimeupdate = () => {
  const cur = video.currentTime, dur = video.duration || 1;
  if (Math.abs(cur - lastSentPos) > 1) {
    lastSentPos = cur;
    ws.send({type:'position_update', position:cur, duration:dur});
  }
  if (dur - cur < 0.5 && dur > 0 && !songEndSent) {
    songEndSent = true;
    ws.send({type:'song_end'});
  }
};

video.onerror = () => {
  if (!currentSong) return;
  const sid = currentSong.id;
  retryCount++;
  if (retryCount > MAX_RETRIES) return;
  fetch(`/api/media/${sid}`).then(r=>{
    // 仅当仍是同一首歌且文件尚未就绪时才重试; 已就绪/纯音频不重试
    if (r.status === 404 && currentSong && currentSong.id === sid
        && !['ready','audio_only'].includes(currentSong.download_status)) {
      retryTimer = setTimeout(() => {
        retryTimer = null;
        if (currentSong && currentSong.id === sid) {
          video.src = `/api/media/${sid}`;
          video.play().catch(() => {});
        }
      }, 2000);
    }
  }).catch(() => {});
};
</script>
</body>
</html>
